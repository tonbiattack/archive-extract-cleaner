name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: Check formatting
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) {
            Write-Host "Unformatted files:"
            $files
            exit 1
          }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: Frontend tests
        shell: bash
        run: node --test frontend/tests/*.test.js

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Add Go bin to PATH
        shell: pwsh
        run: |
          $wailsPath = Join-Path (go env GOPATH) "bin"
          $wailsPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows GUI
        run: wails build -clean

      - name: Verify executable version
        shell: pwsh
        run: |
          $path = (Resolve-Path "build/bin/archive-extract-cleaner.exe").Path
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($path)
          $expected = (Get-Content wails.json -Raw | ConvertFrom-Json).info.productVersion
          if ($info.ProductVersionRaw.ToString() -ne "$expected.0") {
            throw "Executable version $($info.ProductVersionRaw) does not match $expected"
          }

      - name: Generate store assets
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python tools/make_icon.py

      - name: Build MSIX (Partner Center identity)
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: tonbiattack.ZipSweep
          MSIX_PUBLISHER: CN=2F14A66E-02DF-43E2-93E0-5C5900B38D2E
          MSIX_PUBLISHER_DISPLAY_NAME: tonbiattack
          MSIX_VERSION: 0.1.0.0
        run: |
          pwsh -NoProfile -File tools/build-msix.ps1 -Exe build/bin/archive-extract-cleaner.exe -Out build/msix

      - name: Verify MSIX manifest matches Partner Center
        shell: pwsh
        run: |
          # Store の受領検証は Properties/PublisherDisplayName を Partner Center の
          # 発行者表示名と照合する。WACK はここを見ないため、明示的に確認する。
          $unpacked = Join-Path $env:RUNNER_TEMP "msix-manifest"
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\makeappx.exe" } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          & $makeappx unpack /p build/msix/ZipSweep.msix /d $unpacked /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx unpack failed" }
          [xml]$manifest = Get-Content (Join-Path $unpacked "AppxManifest.xml") -Raw
          $expected = @{
            "Identity Name" = "tonbiattack.ZipSweep"
            "Identity Publisher" = "CN=2F14A66E-02DF-43E2-93E0-5C5900B38D2E"
            "Properties DisplayName" = "ZipSweep"
            "Properties PublisherDisplayName" = "tonbiattack"
            "Identity Version" = "0.1.0.0"
            "Identity ProcessorArchitecture" = "x64"
          }
          $actual = @{
            "Identity Name" = $manifest.Package.Identity.Name
            "Identity Publisher" = $manifest.Package.Identity.Publisher
            "Properties DisplayName" = $manifest.Package.Properties.DisplayName
            "Properties PublisherDisplayName" = $manifest.Package.Properties.PublisherDisplayName
            "Identity Version" = $manifest.Package.Identity.Version
            "Identity ProcessorArchitecture" = $manifest.Package.Identity.ProcessorArchitecture
          }
          $failed = @()
          foreach ($key in $expected.Keys) {
            if ($actual[$key] -ne $expected[$key]) {
              $failed += "$key = '$($actual[$key])' (want '$($expected[$key])')"
            }
          }
          if ($failed.Count -gt 0) {
            throw "MSIX manifest does not match Partner Center:`n" + ($failed -join "`n")
          }
          Write-Host "manifest matches Partner Center"

      - name: Verify MSIX payload
        shell: pwsh
        run: |
          $package = "build/msix/ZipSweep.msix"
          if (-not (Test-Path $package)) { throw "MSIX not created" }
          $unpacked = Join-Path $env:RUNNER_TEMP "msix-unpacked"
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\makeappx.exe" } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          & $makeappx unpack /p $package /d $unpacked /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx unpack failed" }
          $built = (Get-FileHash "build/bin/archive-extract-cleaner.exe").Hash
          $packed = (Get-FileHash (Join-Path $unpacked "archive-extract-cleaner.exe")).Hash
          if ($built -ne $packed) { throw "MSIX payload does not match the built executable" }
          Write-Host "MSIX payload verified"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: archive-extract-cleaner-windows-amd64
          path: build/bin/archive-extract-cleaner.exe
          if-no-files-found: error

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: zipsweep-msix
          path: build/msix/ZipSweep.msix
          if-no-files-found: error
