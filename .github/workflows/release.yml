name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: Frontend tests
        shell: bash
        run: node --test frontend/tests/*.test.js

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Add Go bin to PATH
        shell: pwsh
        run: |
          $wailsPath = Join-Path (go env GOPATH) "bin"
          $wailsPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows GUI
        run: wails build -clean

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "build/bin/archive-extract-cleaner.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "ビルド成果物が見つかりません: $exe"
            exit 1
          }
          Get-Item $exe | Select-Object Name, Length

      - name: Write release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $lines = @(
            "## archive-extract-cleaner $tag",
            "",
            "Windows 向けの実行ファイルです。ダウンロードして任意のフォルダに置き、実行してください。",
            "",
            "### 動作環境",
            "",
            "- Windows 11 x64",
            "- ``.zip`` は標準機能で照合できます",
            "- ``.7z`` / ``.rar`` の照合には [7-Zip](https://www.7-zip.org/) が必要です（未導入なら UNVERIFIED として両方保持）",
            "",
            "### 注意",
            "",
            "- **重要なデータは事前にバックアップしてください。**",
            "- 削除は Windows のごみ箱への移動だけで、完全削除は行いません。",
            "- ごみ箱へ移動した容量は、ごみ箱を空にするまでディスクの空き容量として戻りません。",
            "- 詳しくは [README](https://github.com/$repo/blob/main/README.md) と [SECURITY.md](https://github.com/$repo/blob/main/SECURITY.md) を参照してください。",
            "",
            "### 検証",
            "",
            "このリリースは CI で ``go vet``、``go test ./...``、フロントエンドテスト、Wails ビルドを通過した成果物です。"
          )
          $lines -join "`n" | Out-File -FilePath release-notes.md -Encoding utf8

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag "build/bin/archive-extract-cleaner.exe" `
            --title "archive-extract-cleaner $tag" `
            --notes-file release-notes.md
